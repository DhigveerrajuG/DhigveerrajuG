<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="100%" height="200" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Accent Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="circuitGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5" />
      <circle cx="24" cy="24" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulsePing {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.3); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes circuitFlow {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }

      .radar-arm {
        transform-origin: 730px 100px;
        animation: radarSweep 8s linear infinite;
      }
      .ping-dot {
        transform-origin: 32px 34px;
        animation: pulsePing 2s ease-in-out infinite;
      }
      .cursor {
        animation: blinkCursor 0.9s infinite;
      }
      .circuit-line {
        stroke-dasharray: 6 4;
        animation: circuitFlow 3s linear infinite;
      }
      .label-mono {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      }
      .font-tech {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="840" height="200" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Blueprint Grid -->
  <rect width="840" height="200" rx="12" fill="url(#circuitGrid)" />

  <!-- Top Accent Beam -->
  <path d="M 0 12 Q 0 0 12 0 L 828 0 Q 840 0 840 12 L 840 4 L 0 4 Z" fill="url(#beamGrad)" />

  <!-- Corner Tech Brackets -->
  <path d="M 16 28 L 16 16 L 28 16" stroke="#38bdf8" stroke-width="1.5" fill="none" />
  <path d="M 824 28 L 824 16 L 812 16" stroke="#38bdf8" stroke-width="1.5" fill="none" />
  <path d="M 16 172 L 16 184 L 28 184" stroke="#38bdf8" stroke-width="1.5" fill="none" />
  <path d="M 824 172 L 824 184 L 812 184" stroke="#38bdf8" stroke-width="1.5" fill="none" />

  <!-- Live Pulse Beacon -->
  <circle cx="38" cy="36" r="8" fill="#10b981" class="ping-dot" />
  <circle cx="38" cy="36" r="4" fill="#10b981" filter="url(#glow)" />
  <text x="54" y="40" fill="#10b981" font-size="11" font-weight="700" letter-spacing="1.2" class="label-mono font-tech">SYSTEM STATUS: ONLINE // RUNTIME_ACTIVE</text>

  <!-- Telemetry Badge (Top Right) -->
  <rect x="630" y="24" width="180" height="24" rx="4" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
  <text x="642" y="40" fill="#94a3b8" font-size="10.5" font-weight="600" class="label-mono">ROBOTICS &amp; AI LAB 🇮🇳</text>

  <!-- Left Circuit Trace Line -->
  <path d="M 38 46 L 38 85 L 60 107 L 80 107" stroke="#38bdf8" stroke-width="1" fill="none" class="circuit-line" stroke-opacity="0.6" />

  <!-- Main Hero Title -->
  <text x="82" y="98" fill="url(#textGrad)" font-size="34" font-weight="800" letter-spacing="0.5" class="font-tech" filter="url(#glow)">DHIGVEERRAJU G</text>

  <!-- Subtitle -->
  <text x="84" y="125" fill="#38bdf8" font-size="14.5" font-weight="600" letter-spacing="0.4" class="font-tech">Robotics &amp; Artificial Intelligence Engineer • Hands-On Hardware Prototyper</text>

  <!-- Terminal Command Prompt Box -->
  <rect x="84" y="142" width="510" height="32" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1" />
  <circle cx="98" cy="158" r="3" fill="#ef4444" />
  <circle cx="108" cy="158" r="3" fill="#f59e0b" />
  <circle cx="118" cy="158" r="3" fill="#10b981" />
  <text x="132" y="163" fill="#64748b" font-size="12" class="label-mono">root@dhigveer:~#</text>
  <text x="264" y="163" fill="#e2e8f0" font-size="12" font-weight="500" class="label-mono">deploy --pipeline="vision_actuation"<tspan fill="#38bdf8" class="cursor"> _</tspan></text>

  <!-- Radar / Sensor Reticle (Right Side) -->
  <g opacity="0.85">
    <circle cx="730" cy="115" r="55" stroke="#1e293b" stroke-width="1" fill="#030712" fill-opacity="0.4" />
    <circle cx="730" cy="115" r="40" stroke="#1e293b" stroke-width="0.8" fill="none" />
    <circle cx="730" cy="115" r="22" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" fill="none" />
    <circle cx="730" cy="115" r="3" fill="#38bdf8" />
    <!-- Reticle Crosshairs -->
    <line x1="665" y1="115" x2="795" y2="115" stroke="#1e293b" stroke-width="0.8" />
    <line x1="730" y1="50" x2="730" y2="180" stroke="#1e293b" stroke-width="0.8" />
    <!-- Radar Arm -->
    <g class="radar-arm">
      <line x1="730" y1="115" x2="785" y2="115" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" filter="url(#glow)" />
      <polygon points="730,115 785,100 785,115" fill="#38bdf8" fill-opacity="0.15" />
    </g>
    <!-- Radar Blips -->
    <circle cx="755" cy="95" r="2" fill="#10b981" filter="url(#glow)" />
    <circle cx="710" cy="138" r="2.5" fill="#38bdf8" filter="url(#glow)" />
    <!-- Subsystem Indicators -->
    <text x="730" y="184" text-anchor="middle" fill="#64748b" font-size="9" class="label-mono">RADAR // SENSOR_LOCK</text>
  </g>
</svg>
