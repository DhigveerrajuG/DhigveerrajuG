<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAnatomy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blueGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <pattern id="blueprintGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.75"/>
    </pattern>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .pulse-node {
      animation: pulseAnim 2.2s ease-in-out infinite alternate;
    }
    .hud-title {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #38bdf8;
      letter-spacing: 0.5px;
    }
    .hud-sub {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 10px;
      fill: #94a3b8;
    }
    .bot-float {
      animation: botHover 3.4s ease-in-out infinite;
      transform-origin: center center;
    }
    .beam-line {
      stroke-dasharray: 6 4;
      animation: dashMove 20s linear infinite;
    }
    @keyframes pulseAnim {
      0% { opacity: 0.45; filter: drop-shadow(0 0 1px #38bdf8); }
      100% { opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
    }
    @keyframes botHover {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
  </style>

  <!-- Blueprint Background Container -->
  <rect x="2" y="2" width="776" height="336" rx="12" fill="url(#bgAnatomy)" stroke="#1e3a8a" stroke-width="2"/>
  <rect x="8" y="8" width="764" height="324" rx="8" fill="url(#blueprintGrid)"/>

  <!-- Top System Header Bar -->
  <rect x="18" y="16" width="744" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle class="pulse-node" cx="32" cy="29" r="4.5" fill="#38bdf8"/>
  <text x="44" y="33" class="hud-title" fill="#f8fafc">SYSTEM ARCHITECTURE BLUEPRINT // DHIGVEERRAJU G [ROBOTICS &amp; AI STUDENT]</text>
  <text x="615" y="33" class="hud-sub">STATUS: <tspan fill="#34d399" font-weight="bold">PROTOTYPE READY</tspan></text>

  <!-- ==================== CENTRAL ROBOT FIGURE ==================== -->
  <g class="bot-float" transform="translate(290, 48)">
    <!-- Ground Shadow -->
    <ellipse cx="100" cy="265" rx="50" ry="7" fill="#1e293b" opacity="0.6"/>

    <!-- Antenna -->
    <line x1="100" y1="46" x2="100" y2="18" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <circle class="pulse-node" cx="100" cy="16" r="7" fill="#38bdf8" filter="url(#neonGlow)"/>
    <circle cx="100" cy="16" r="3.5" fill="#ffffff"/>

    <!-- Head / Helmet -->
    <rect x="52" y="44" width="96" height="66" rx="30" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    
    <!-- Visor (Eyes) -->
    <rect x="64" y="60" width="72" height="34" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <ellipse class="pulse-node" cx="84" cy="77" rx="6.5" ry="7" fill="#38bdf8" filter="url(#neonGlow)"/>
    <circle cx="84" cy="77" r="3" fill="#ffffff"/>
    <ellipse class="pulse-node" cx="116" cy="77" rx="6.5" ry="7" fill="#38bdf8" filter="url(#neonGlow)"/>
    <circle cx="116" cy="77" r="3" fill="#ffffff"/>

    <!-- Torso / Body -->
    <rect x="58" y="116" width="84" height="80" rx="16" fill="#f1f5f9" stroke="#2563eb" stroke-width="3"/>
    
    <!-- Core Reactor (Chest) -->
    <circle cx="100" cy="156" r="14" fill="#0f172a" stroke="#2563eb" stroke-width="2.5"/>
    <circle class="pulse-node" cx="100" cy="156" r="8" fill="#38bdf8" filter="url(#neonGlow)"/>
    <circle cx="100" cy="156" r="3.5" fill="#ffffff"/>

    <!-- Left Arm & Hand (Actuator) -->
    <path d="M 58 126 C 36 130, 28 152, 40 176" stroke="#2563eb" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="40" cy="178" r="9" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M 33 186 L 38 196 M 47 186 L 42 196" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Right Arm & Hand (Actuator) -->
    <path d="M 142 126 C 164 130, 172 152, 160 176" stroke="#2563eb" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="160" cy="178" r="9" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M 153 186 L 158 196 M 167 186 L 162 196" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Left Leg & Powertrain -->
    <rect x="68" y="200" width="18" height="42" rx="6" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <rect x="60" y="242" width="30" height="14" rx="5" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>

    <!-- Right Leg & Powertrain -->
    <rect x="114" y="200" width="18" height="42" rx="6" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <rect x="110" y="242" width="30" height="14" rx="5" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>
  </g>

  <!-- ==================== HUD CALLOUT LABELS ==================== -->

  <!-- 1. EYES / VISOR (Top Left) -->
  <g transform="translate(24, 72)">
    <rect x="0" y="0" width="230" height="52" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="12" y="20" class="hud-title">01. 👁️ SENSORY &amp; VISION [EYES]</text>
    <text x="12" y="38" class="hud-sub">YOLOv8 • OpenCV • Edge Detection</text>
    <!-- Pointer Line to Eyes -->
    <path class="beam-line" d="M 230 26 L 350 26 L 365 110" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <circle cx="365" cy="110" r="4" fill="#38bdf8" filter="url(#neonGlow)"/>
  </g>

  <!-- 2. BRAIN & CORE (Bottom Left) -->
  <g transform="translate(24, 192)">
    <rect x="0" y="0" width="230" height="52" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="12" y="20" class="hud-title">02. 🧠 BRAIN &amp; CORE [BODY]</text>
    <text x="12" y="38" class="hud-sub">Student Mind • Arduino • SIH '26</text>
    <!-- Pointer Line to Torso/Chest -->
    <path class="beam-line" d="M 230 26 L 360 26 L 385 195" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <circle cx="385" cy="195" r="4" fill="#38bdf8" filter="url(#neonGlow)"/>
  </g>

  <!-- 3. ARMS & HANDS (Top Right) -->
  <g transform="translate(526, 72)">
    <rect x="0" y="0" width="230" height="52" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="12" y="20" class="hud-title">03. 🦾 ACTUATORS &amp; TOOLS [HANDS]</text>
    <text x="12" y="38" class="hud-sub">PWM Motor Ramping • C++ • L298N</text>
    <!-- Pointer Line to Right Hand -->
    <path class="beam-line" d="M 0 26 L -75 26 L -75 210" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <circle cx="451" cy="210" r="4" fill="#38bdf8" filter="url(#neonGlow)"/>
  </g>

  <!-- 4. LEGS & POWERTRAIN (Bottom Right) -->
  <g transform="translate(526, 192)">
    <rect x="0" y="0" width="230" height="52" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="12" y="20" class="hud-title">04. 🦿 KINEMATICS &amp; ROADMAP [LEGS]</text>
    <text x="12" y="38" class="hud-sub">Optical Encoders • PRIZM • Quest</text>
    <!-- Pointer Line to Legs -->
    <path class="beam-line" d="M 0 26 L -105 26 L -105 270" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <circle cx="421" cy="270" r="4" fill="#38bdf8" filter="url(#neonGlow)"/>
  </g>

  <!-- Bottom Global Telemetry Indicator -->
  <rect x="18" y="296" width="744" height="26" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="28" y="313" class="hud-sub">COMMUNICATION ARRAY: <tspan fill="#38bdf8" font-weight="bold">ANTENNA TRANSMITTING</tspan>  |  CORE BATTERY: <tspan fill="#34d399">100% CURIOSITY</tspan>  |  LOCATION: <tspan fill="#f8fafc">INDIA 🇮🇳</tspan></text>
</svg>
