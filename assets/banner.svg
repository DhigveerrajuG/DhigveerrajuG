<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 140" width="100%" height="140" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Top Accent Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="circuitGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.4" />
      <circle cx="24" cy="24" r="1" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.3); }
      }
      .ping-dot {
        transform-origin: 38px 32px;
        animation: pulseDot 2.5s ease-in-out infinite;
      }
      .label-mono {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Container Outer Card -->
  <rect width="840" height="140" rx="10" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.2" />
  
  <!-- Subtle Blueprint Grid Pattern -->
  <rect width="840" height="140" rx="10" fill="url(#circuitGrid)" />

  <!-- Top Accent Beam -->
  <path d="M 0 10 Q 0 0 10 0 L 830 0 Q 840 0 840 10 L 840 3.5 L 0 3.5 Z" fill="url(#beamGrad)" />

  <!-- Corner Tech Brackets -->
  <path d="M 14 24 L 14 14 L 24 14" stroke="#38bdf8" stroke-width="1.2" fill="none" opacity="0.6" />
  <path d="M 826 24 L 826 14 L 816 14" stroke="#38bdf8" stroke-width="1.2" fill="none" opacity="0.6" />
  <path d="M 14 116 L 14 126 L 24 126" stroke="#38bdf8" stroke-width="1.2" fill="none" opacity="0.6" />
  <path d="M 826 116 L 826 126 L 816 126" stroke="#38bdf8" stroke-width="1.2" fill="none" opacity="0.6" />

  <!-- Status Indicator (Top Left) -->
  <circle cx="38" cy="32" r="6" fill="#10b981" class="ping-dot" />
  <circle cx="38" cy="32" r="3" fill="#10b981" filter="url(#glow)" />
  <text x="52" y="36" fill="#10b981" font-size="10.5" font-weight="700" letter-spacing="1" class="label-mono font-sans">STATUS: ACTIVE // UNDERGRADUATE STUDENT</text>

  <!-- Country Tag (Top Right) -->
  <rect x="736" y="22" width="76" height="20" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
  <text x="746" y="35.5" fill="#94a3b8" font-size="10" font-weight="600" class="label-mono">INDIA 🇮🇳</text>

  <!-- Main Name Title -->
  <text x="36" y="80" fill="url(#textGrad)" font-size="34" font-weight="800" letter-spacing="0.5" class="font-sans">DHIGVEERRAJU G</text>

  <!-- Subtitle -->
  <text x="38" y="106" fill="#38bdf8" font-size="13.5" font-weight="600" letter-spacing="0.3" class="font-sans">Robotics &amp; Artificial Intelligence • Embedded Firmware &amp; Computer Vision Prototyper</text>
</svg>
