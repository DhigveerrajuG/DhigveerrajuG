<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="100%" height="200" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Accent Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Chip Background Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="circuitGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.45" />
      <circle cx="24" cy="24" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulsePing {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.25); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes busPulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .ping-dot {
        transform-origin: 38px 36px;
        animation: pulsePing 2.5s ease-in-out infinite;
      }
      .cursor {
        animation: blinkCursor 0.9s infinite;
      }
      .bus-led {
        animation: busPulse 2s ease-in-out infinite;
      }
      .label-mono {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      }
      .font-tech {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Container Outer Card -->
  <rect width="840" height="200" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Blueprint Grid Pattern -->
  <rect width="840" height="200" rx="12" fill="url(#circuitGrid)" />

  <!-- Top Accent Beam -->
  <path d="M 0 12 Q 0 0 12 0 L 828 0 Q 840 0 840 12 L 840 4 L 0 4 Z" fill="url(#beamGrad)" />

  <!-- Corner Tech Brackets -->
  <path d="M 16 28 L 16 16 L 28 16" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.8" />
  <path d="M 824 28 L 824 16 L 812 16" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.8" />
  <path d="M 16 172 L 16 184 L 28 184" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.8" />
  <path d="M 824 172 L 824 184 L 812 184" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.8" />

  <!-- Live Pulse Beacon & Status -->
  <circle cx="38" cy="36" r="7" fill="#10b981" class="ping-dot" />
  <circle cx="38" cy="36" r="3.5" fill="#10b981" filter="url(#glow)" />
  <text x="54" y="40" fill="#10b981" font-size="11" font-weight="700" letter-spacing="1.2" class="label-mono font-tech">SYSTEM STATUS: ONLINE // RUNTIME_ACTIVE</text>

  <!-- Telemetry Badge (Top Center-Right) -->
  <rect x="420" y="24" width="170" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
  <text x="432" y="40" fill="#94a3b8" font-size="10.5" font-weight="600" class="label-mono">ROBOTICS &amp; AI LAB 🇮🇳</text>

  <!-- Circuit Trace Line to Name -->
  <path d="M 38 46 L 38 85 L 60 107 L 80 107" stroke="#38bdf8" stroke-width="1" fill="none" stroke-opacity="0.5" />
  <circle cx="80" cy="107" r="2" fill="#38bdf8" />

  <!-- Main Hero Title -->
  <text x="82" y="98" fill="url(#textGrad)" font-size="34" font-weight="800" letter-spacing="0.5" class="font-tech" filter="url(#glow)">DHIGVEERRAJU G</text>

  <!-- Subtitle -->
  <text x="84" y="125" fill="#38bdf8" font-size="14.5" font-weight="600" letter-spacing="0.4" class="font-tech">Robotics &amp; Artificial Intelligence Engineer • Hands-On Hardware Prototyper</text>

  <!-- Terminal Command Prompt Box -->
  <rect x="84" y="142" width="490" height="32" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1" />
  <circle cx="98" cy="158" r="3" fill="#ef4444" />
  <circle cx="108" cy="158" r="3" fill="#f59e0b" />
  <circle cx="118" cy="158" r="3" fill="#10b981" />
  <text x="132" y="163" fill="#64748b" font-size="11.5" class="label-mono">root@dhigveer:~#</text>
  <text x="256" y="163" fill="#e2e8f0" font-size="11.5" font-weight="500" class="label-mono">deploy --pipeline="vision_actuation"<tspan fill="#38bdf8" class="cursor"> _</tspan></text>

  <!-- ======================================================== -->
  <!-- RIGHT SIDE: LEARNING STATS HUD MODULE                    -->
  <!-- ======================================================== -->
  <g transform="translate(605, 30)">
    <!-- Outer Telemetry HUD Box -->
    <rect width="215" height="144" rx="8" fill="url(#chipGrad)" stroke="#334155" stroke-width="1.2" />
    
    <!-- Top Header Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 207 0 Q 215 0 215 8 L 215 26 L 0 26 Z" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
    <circle cx="14" cy="13" r="3" fill="#38bdf8" class="bus-led" />
    <text x="24" y="17" fill="#38bdf8" font-size="9.5" font-weight="700" letter-spacing="0.8" class="label-mono">LEARNING STATS</text>

    <!-- Learning Stats Rows -->
    <!-- Row 1: ROS2 -->
    <g transform="translate(14, 46)">
      <text x="0" y="0" fill="#64748b" font-size="9" font-weight="600" class="label-mono">ROS / ROS2</text>
      <text x="80" y="0" fill="#f8fafc" font-size="9" font-weight="700" class="label-mono">Nodes &amp; Pub/Sub</text>
      <circle cx="178" cy="-3" r="2.5" fill="#38bdf8" />
    </g>

    <!-- Divider Line -->
    <line x1="14" y1="55" x2="201" y2="55" stroke="#1e293b" stroke-width="0.8" />

    <!-- Row 2: PID CONTROL -->
    <g transform="translate(14, 71)">
      <text x="0" y="0" fill="#64748b" font-size="9" font-weight="600" class="label-mono">PID CONTROL</text>
      <text x="80" y="0" fill="#10b981" font-size="9" font-weight="700" class="label-mono">Velocity Tuning</text>
      <circle cx="178" cy="-3" r="2.5" fill="#10b981" />
    </g>

    <!-- Divider Line -->
    <line x1="14" y1="80" x2="201" y2="80" stroke="#1e293b" stroke-width="0.8" />

    <!-- Row 3: EDGE AI -->
    <g transform="translate(14, 96)">
      <text x="0" y="0" fill="#64748b" font-size="9" font-weight="600" class="label-mono">EDGE AI</text>
      <text x="80" y="0" fill="#38bdf8" font-size="9" font-weight="700" class="label-mono">TensorRT/Jetson</text>
      <circle cx="178" cy="-3" r="2.5" fill="#38bdf8" />
    </g>

    <!-- Divider Line -->
    <line x1="14" y1="105" x2="201" y2="105" stroke="#1e293b" stroke-width="0.8" />

    <!-- Row 4: FIRMWARE -->
    <g transform="translate(14, 121)">
      <text x="0" y="0" fill="#64748b" font-size="9" font-weight="600" class="label-mono">FIRMWARE</text>
      <text x="80" y="0" fill="#f59e0b" font-size="9" font-weight="700" class="label-mono">Bare-Metal C++</text>
      <circle cx="178" cy="-3" r="2.5" fill="#f59e0b" />
    </g>

    <!-- Bottom Status Strip -->
    <rect x="0" y="132" width="215" height="12" rx="0" fill="#020617" opacity="0.6" />
    <text x="107" y="141" text-anchor="middle" fill="#475569" font-size="8" class="label-mono">LEARNING ROADMAP: ACTIVE</text>
  </g>
</svg>
