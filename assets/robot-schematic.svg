<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .pulse-node {
      animation: pulseGlow 2.5s infinite ease-in-out alternate;
    }
    .sweep-line {
      animation: traceDash 3s linear infinite;
    }
    .hud-box {
      fill: #0b1329;
      stroke: #2563eb;
      stroke-width: 1.5;
      rx: 6px;
    }
    .hud-title {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #38bdf8;
      letter-spacing: 0.5px;
    }
    .hud-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 10px;
      fill: #94a3b8;
    }
    @keyframes pulseGlow {
      0% { opacity: 0.4; r: 3.5px; }
      100% { opacity: 1; r: 6px; filter: drop-shadow(0 0 6px #38bdf8); }
    }
    @keyframes traceDash {
      to { stroke-dashoffset: -40; }
    }
  </style>

  <!-- Blueprint Background Grid -->
  <rect width="840" height="380" rx="12" fill="url(#bgGrad)" stroke="#1e3a8a" stroke-width="2"/>
  <rect x="8" y="8" width="824" height="364" rx="8" fill="url(#grid)"/>

  <!-- Top Schematic Header -->
  <text x="24" y="32" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">SYSTEM SCHEMATIC // DHIGVEERRAJU G [AUTONOMOUS CYBERNETIC ARCHITECTURE]</text>
  <text x="690" y="32" font-family="'Fira Code', monospace" font-size="11" fill="#10b981">STATUS: OPERATIONAL ●</text>

  <!-- ================= CENTRAL ROBOT ANATOMY WIREFRAME ================= -->
  <g transform="translate(420, 195)">
    <!-- Antenna -->
    <line x1="0" y1="-128" x2="0" y2="-100" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="0" cy="-132" r="5" fill="#38bdf8" filter="url(#neon)"/>
    
    <!-- Head Unit -->
    <rect x="-32" y="-100" width="64" height="42" rx="10" fill="#0f172a" stroke="#2563eb" stroke-width="2.5"/>
    <!-- Visor Eyes -->
    <rect x="-22" y="-88" width="44" height="18" rx="6" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="-10" cy="-79" r="4" fill="#38bdf8" class="pulse-node"/>
    <circle cx="10" cy="-79" r="4" fill="#38bdf8" class="pulse-node"/>

    <!-- Neck Connector -->
    <rect x="-8" y="-58" width="16" height="10" fill="#1e293b"/>

    <!-- Torso / Power Core -->
    <rect x="-46" y="-48" width="92" height="88" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="2.5"/>
    <!-- Reactor Core -->
    <circle cx="0" cy="-4" r="18" fill="#0b1329" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="-4" r="10" fill="#2563eb" class="pulse-node"/>
    <circle cx="0" cy="-4" r="4" fill="#ffffff"/>

    <!-- Left Arm & Hand (Viewer's Left) -->
    <!-- Shoulder -->
    <circle cx="-56" cy="-38" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <!-- Upper Arm -->
    <line x1="-56" y1="-30" x2="-68" y2="4" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <!-- Elbow Joint -->
    <circle cx="-68" cy="4" r="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Forearm -->
    <line x1="-68" y1="10" x2="-78" y2="46" stroke="#2563eb" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Hand / Gripper -->
    <path d="M -84 46 L -78 58 L -72 46" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Right Arm & Hand (Viewer's Right) -->
    <!-- Shoulder -->
    <circle cx="56" cy="-38" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <!-- Upper Arm -->
    <line x1="56" y1="-30" x2="68" y2="4" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <!-- Elbow Joint -->
    <circle cx="68" cy="4" r="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Forearm -->
    <line x1="68" y1="10" x2="78" y2="46" stroke="#2563eb" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Hand / Gripper -->
    <path d="M 72 46 L 78 58 L 84 46" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Pelvis -->
    <rect x="-24" y="40" width="48" height="14" rx="4" fill="#1e293b"/>

    <!-- Left Leg (Viewer's Left) -->
    <circle cx="-16" cy="54" r="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="-16" y1="60" x2="-22" y2="98" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-22" cy="98" r="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="-22" y1="103" x2="-26" y2="136" stroke="#2563eb" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Foot Pad -->
    <rect x="-36" y="136" width="22" height="8" rx="3" fill="#38bdf8"/>

    <!-- Right Leg (Viewer's Right) -->
    <circle cx="16" cy="54" r="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="16" y1="60" x2="22" y2="98" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <circle cx="22" cy="98" r="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="22" y1="103" x2="26" y2="136" stroke="#2563eb" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Foot Pad -->
    <rect x="14" y="136" width="22" height="8" rx="3" fill="#38bdf8"/>
  </g>

  <!-- ================= CIRCUIT LEADER LINES & HUD CALLOUTS ================= -->

  <!-- 1. [ANTENNA & COMMS] -> Top Left -->
  <path d="M 420 63 L 340 63 L 260 63" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" class="sweep-line"/>
  <circle cx="420" cy="63" r="3.5" fill="#38bdf8"/>
  <g transform="translate(24, 48)">
    <rect width="232" height="58" class="hud-box"/>
    <text x="12" y="22" class="hud-title">📡 [00] ANTENNA &amp; UPLINK</text>
    <text x="12" y="38" class="hud-desc">• Live Portfolio &amp; LinkedIn Channel</text>
    <text x="12" y="50" class="hud-desc">• Student Networking &amp; Comms</text>
  </g>

  <!-- 2. [EYES & SENSORS] -> Top Right -->
  <path d="M 442 116 L 530 84 L 590 84" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" class="sweep-line"/>
  <circle cx="442" cy="116" r="3.5" fill="#38bdf8"/>
  <g transform="translate(590, 56)">
    <rect width="226" height="58" class="hud-box"/>
    <text x="12" y="22" class="hud-title">👁️ [01] EYES &amp; PERCEPTION</text>
    <text x="12" y="38" class="hud-desc">• Ultralytics YOLOv8 Anomaly Detection</text>
    <text x="12" y="50" class="hud-desc">• OpenCV Optical Contour Tracking</text>
  </g>

  <!-- 3. [BRAIN & CPU] -> Middle Left -->
  <path d="M 390 120 L 320 155 L 260 155" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" class="sweep-line"/>
  <circle cx="390" cy="120" r="3.5" fill="#38bdf8"/>
  <g transform="translate(24, 126)">
    <rect width="232" height="58" class="hud-box"/>
    <text x="12" y="22" class="hud-title">🧠 [02] BRAIN &amp; LOGIC CORE</text>
    <text x="12" y="38" class="hud-desc">• Dhigveerraju G: Robotics &amp; AI Student</text>
    <text x="12" y="50" class="hud-desc">• Core Logic in C++, Python, Algorithms</text>
  </g>

  <!-- 4. [HANDS & TOOLS] -> Middle Right -->
  <path d="M 498 241 L 550 205 L 590 205" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" class="sweep-line"/>
  <circle cx="498" cy="241" r="3.5" fill="#38bdf8"/>
  <g transform="translate(590, 176)">
    <rect width="226" height="58" class="hud-box"/>
    <text x="12" y="22" class="hud-title">🦾 [03] HANDS &amp; TOOLING</text>
    <text x="12" y="38" class="hud-desc">• Hardware Breadboarding &amp; Arduino</text>
    <text x="12" y="50" class="hud-desc">• Smart India Hackathon '26 Operations</text>
  </g>

  <!-- 5. [TORSO & POWER] -> Bottom Left -->
  <path d="M 380 195 L 310 270 L 260 270" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" class="sweep-line"/>
  <circle cx="380" cy="195" r="3.5" fill="#38bdf8"/>
  <g transform="translate(24, 240)">
    <rect width="232" height="58" class="hud-box"/>
    <text x="12" y="22" class="hud-title">⚡ [04] TORSO &amp; POWER CORE</text>
    <text x="12" y="38" class="hud-desc">• L298N H-Bridge Dual Actuation Rails</text>
    <text x="12" y="50" class="hud-desc">• Vishwakarma Web System Backbone</text>
  </g>

  <!-- 6. [LEGS & ACTUATORS] -> Bottom Right -->
  <path d="M 446 331 L 520 315 L 590 315" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" class="sweep-line"/>
  <circle cx="446" cy="331" r="3.5" fill="#38bdf8"/>
  <g transform="translate(590, 286)">
    <rect width="226" height="58" class="hud-box"/>
    <text x="12" y="22" class="hud-title">🦿 [05] LEGS &amp; ACTUATION</text>
    <text x="12" y="38" class="hud-desc">• Mathematical PWM Soft-Start Ramping</text>
    <text x="12" y="50" class="hud-desc">• TETRIX PRIZM Closed-Loop Encoders</text>
  </g>
</svg>
