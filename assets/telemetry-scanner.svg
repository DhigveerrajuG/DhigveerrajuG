<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .scanner-beam {
      animation: scanSweep 3.6s ease-in-out infinite alternate;
    }
    .hud-reticle {
      animation: reticlePulse 2s ease-in-out infinite;
    }
    .blink-dot {
      animation: blinkDot 1s infinite;
    }
    .status-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11.5px;
      fill: #94a3b8;
    }
    .metric-value {
      font-weight: 700;
      fill: #38bdf8;
    }
    .alert-tag {
      font-weight: 700;
      fill: #34d399;
    }

    @keyframes scanSweep {
      0% { transform: translateX(20px); }
      100% { transform: translateX(540px); }
    }
    @keyframes reticlePulse {
      0%, 100% { transform: scale(1); stroke-opacity: 0.9; }
      50% { transform: scale(1.04); stroke-opacity: 0.45; }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
  </style>

  <!-- HUD Chassis Container -->
  <rect x="2" y="2" width="756" height="156" rx="10" fill="url(#bgHud)" stroke="#1e3a8a" stroke-width="2"/>
  <rect x="8" y="8" width="744" height="144" rx="8" fill="url(#gridPattern)"/>

  <!-- Top Status Banner -->
  <rect x="18" y="16" width="724" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle class="blink-dot" cx="32" cy="29" r="4.5" fill="#ef4444"/>
  <text x="44" y="33" class="status-text" font-weight="700" fill="#f8fafc">CONVEYOR SENTINEL AI // TELEMETRY DIAGNOSTICS HUD</text>
  <text x="600" y="33" class="status-text"><tspan class="metric-value">FPS: 42.4</tspan> | LATENCY: <tspan class="metric-value">22ms</tspan></text>

  <!-- Simulated Conveyor Inspection Surface -->
  <line x1="18" y1="92" x2="742" y2="92" stroke="#334155" stroke-dasharray="8 6" stroke-width="1.5"/>

  <!-- Scanning Laser Bar -->
  <g class="scanner-beam">
    <rect x="0" y="46" width="180" height="96" fill="url(#laserGrad)" opacity="0.35"/>
    <line x1="90" y1="46" x2="90" y2="142" stroke="#38bdf8" stroke-width="2.5" filter="url(#laserGlow)"/>
  </g>

  <!-- AI Detection Reticle Bounding Box -->
  <g transform="translate(300, 56)">
    <rect class="hud-reticle" x="0" y="0" width="160" height="66" rx="4" fill="#0284c7" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="6 4"/>
    <!-- Corner Targeting Brackets -->
    <path d="M -4 10 L -4 -4 L 10 -4" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
    <path d="M 150 -4 L 164 -4 L 164 10" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
    <path d="M -4 56 L -4 70 L 10 70" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
    <path d="M 150 70 L 164 70 L 164 56" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
    
    <!-- Defect Tag Overlay -->
    <rect x="0" y="-18" width="148" height="17" rx="3" fill="#2563eb"/>
    <text x="6" y="-6" class="status-text" fill="#ffffff" font-weight="700">YOLOv8: LONGITUDINAL TEAR [94.8%]</text>
  </g>

  <!-- Bottom Real-Time Telemetry Bar -->
  <rect x="18" y="126" width="724" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="28" y="141" class="status-text">MOTOR ACTUATION: <tspan class="metric-value">PWM 86.2% (220/255)</tspan>  |  RPM: <tspan class="metric-value">420.5</tspan>  |  SAFETY RELAY: <tspan class="alert-tag">NOMINAL [INTERLOCK READY]</tspan></text>
</svg>
